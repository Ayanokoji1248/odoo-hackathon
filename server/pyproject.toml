[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# alembic's generated env.py must import after `config = context.config`
"alembic/env.py" = ["E402", "I001"]
"alembic/versions/*" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run, so the async engine pool survives between tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
